<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/html.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/go.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/rust.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/cpp.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        :root {
            --text-color: #1f2937;
            --text-secondary: #6b7280;
            --bg-color: transparent;
            --link-color: #2563eb;
            --code-color: #dc2626;
            --code-bg: rgba(127, 127, 127, 0.12);
            --pre-bg: #f6f8fa;
            --pre-border: #d0d7de;
            --blockquote-border: #3b82f6;
            --blockquote-bg: rgba(59, 130, 246, 0.06);
            --blockquote-text: #475569;
            --table-border: #d0d7de;
            --table-head-bg: #f6f8fa;
            --table-row-bg: #ffffff;
            --hr-color: #d0d7de;
            --scrollbar-thumb: rgba(127, 127, 127, 0.3);
            --scrollbar-thumb-hover: rgba(127, 127, 127, 0.5);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #e5e7eb;
                --text-secondary: #9ca3af;
                --bg-color: transparent;
                --link-color: #60a5fa;
                --code-color: #f87171;
                --code-bg: rgba(255, 255, 255, 0.1);
                --pre-bg: #161b22;
                --pre-border: #30363d;
                --blockquote-border: #60a5fa;
                --blockquote-bg: rgba(96, 165, 250, 0.1);
                --blockquote-text: #d1d5db;
                --table-border: #30363d;
                --table-head-bg: #161b22;
                --table-row-bg: #0d1117;
                --hr-color: #30363d;
                --scrollbar-thumb: rgba(255, 255, 255, 0.2);
                --scrollbar-thumb-hover: rgba(255, 255, 255, 0.35);
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 4px 12px;
            word-wrap: break-word;
            -webkit-text-size-adjust: 100%;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        body.markdown-body h1,
        body.markdown-body h2,
        body.markdown-body h3,
        body.markdown-body h4,
        body.markdown-body h5,
        body.markdown-body h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
        }
        body.markdown-body h1 {
            font-size: 2em;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--hr-color);
        }
        body.markdown-body h2 {
            font-size: 1.5em;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--hr-color);
        }
        body.markdown-body h3 { font-size: 1.25em; }
        body.markdown-body h4 { font-size: 1em; }
        body.markdown-body h5 { font-size: 0.875em; }
        body.markdown-body h6 { font-size: 0.85em; color: var(--text-secondary); }
        body.markdown-body p {
            margin-top: 0;
            margin-bottom: 16px;
        }
        body.markdown-body ul,
        body.markdown-body ol {
            margin-top: 0;
            margin-bottom: 16px;
            padding-left: 2em;
        }
        body.markdown-body li {
            margin-top: 0.25em;
        }
        body.markdown-body li > ul,
        body.markdown-body li > ol {
            margin: 0;
        }
        body.markdown-body li.task-list-item {
            list-style: none;
            margin-left: -1.5em;
        }
        body.markdown-body li.task-list-item input[type="checkbox"] {
            margin-right: 0.5em;
            vertical-align: middle;
        }
        body.markdown-body code {
            padding: 0.2em 0.4em;
            font-size: 85%;
            background-color: var(--code-bg);
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        }
        body.markdown-body pre {
            margin-top: 0;
            margin-bottom: 16px;
            padding: 16px;
            overflow: auto;
            font-size: 85%;
            line-height: 1.45;
            background-color: var(--pre-bg);
            border-radius: 6px;
            border: 1px solid var(--pre-border);
            word-wrap: normal;
        }
        body.markdown-body pre code {
            display: inline;
            padding: 0;
            margin: 0;
            overflow: visible;
            line-height: inherit;
            word-wrap: normal;
            background-color: transparent;
            border: 0;
            font-size: 100%;
        }
        body.markdown-body blockquote {
            margin: 0 0 16px 0;
            padding: 0 1em;
            color: var(--blockquote-text);
            border-left: 0.25em solid var(--blockquote-border);
            background-color: var(--blockquote-bg);
            border-radius: 0 6px 6px 0;
            padding-top: 0.5em;
            padding-bottom: 0.5em;
        }
        body.markdown-body blockquote > :last-child {
            margin-bottom: 0;
        }
        body.markdown-body table {
            border-collapse: collapse;
            margin-bottom: 16px;
            display: block;
            width: max-content;
            max-width: 100%;
            overflow: auto;
        }
        body.markdown-body table th,
        body.markdown-body table td {
            padding: 6px 13px;
            border: 1px solid var(--table-border);
        }
        body.markdown-body table th {
            font-weight: 600;
            background-color: var(--table-head-bg);
        }
        body.markdown-body table tr {
            background-color: var(--table-row-bg);
        }
        body.markdown-body table tr:nth-child(2n) {
            background-color: var(--table-head-bg);
        }
        body.markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-sizing: content-box;
        }
        body.markdown-body hr {
            height: 0.25em;
            padding: 0;
            margin: 24px 0;
            background-color: var(--hr-color);
            border: 0;
        }
        body.markdown-body a {
            color: var(--link-color);
            text-decoration: none;
        }
        body.markdown-body a:hover {
            text-decoration: underline;
        }
        body.markdown-body strong {
            font-weight: 600;
        }
        body.markdown-body em {
            font-style: italic;
        }
        body.markdown-body del,
        body.markdown-body s {
            text-decoration: line-through;
        }
        body.markdown-body details {
            margin-bottom: 16px;
        }
        body.markdown-body summary {
            cursor: pointer;
            font-weight: 600;
            padding: 4px 0;
        }
        body.markdown-body .hljs {
            background: transparent !important;
            padding: 0 !important;
        }
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }
        /* 加载提示 */
        #loading {
            color: var(--text-secondary);
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body class="markdown-body">
    <div id="loading">加载中...</div>
    <div id="content" style="display:none;"></div>
    <script>
        // 配置 marked
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false
            });
        }

        // 渲染 Markdown 内容
        function renderMarkdown(mdContent) {
            var contentEl = document.getElementById('content');
            var loadingEl = document.getElementById('loading');

            try {
                if (typeof marked !== 'undefined') {
                    var html = marked.parse(mdContent);
                    contentEl.innerHTML = html;

                    // 代码高亮
                    if (typeof hljs !== 'undefined') {
                        var codeBlocks = contentEl.querySelectorAll('pre code');
                        for (var i = 0; i < codeBlocks.length; i++) {
                            try {
                                hljs.highlightElement(codeBlocks[i]);
                            } catch(e) {}
                        }
                    }
                } else {
                    // marked 未加载时的降级处理：转义后显示
                    contentEl.innerText = mdContent;
                    contentEl.style.whiteSpace = 'pre-wrap';
                }
            } catch (e) {
                contentEl.innerText = mdContent;
                contentEl.style.whiteSpace = 'pre-wrap';
            }

            loadingEl.style.display = 'none';
            contentEl.style.display = 'block';

            // 通知 Android 渲染完成
            if (typeof AndroidBridge !== 'undefined' && AndroidBridge.onRenderComplete) {
                AndroidBridge.onRenderComplete();
            }
        }

        // 暗色模式下切换 highlight.js 主题
        function updateHighlightTheme() {
            var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var themeLink = document.getElementById('hljs-theme');
            if (isDark) {
                themeLink.href = 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css';
            } else {
                themeLink.href = 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css';
            }
        }

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateHighlightTheme);
        }
        updateHighlightTheme();
    </script>
</body>
</html>
