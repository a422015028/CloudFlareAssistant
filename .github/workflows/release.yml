name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: '版本标签 (例如: v7.7.8)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo $KEYSTORE_BASE64 | base64 -d > $GITHUB_WORKSPACE/app/keystore.jks

    - name: Clean Build Cache
      run: ./gradlew clean

    - name: Run Lint (Release) — HardcodedText 拦截 & i18n 回归
      run: |
        ./gradlew :app:lintRelease --console=plain

    - name: Upload Lint Report (Debug + Release)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-debug.xml
          app/build/reports/lint-results-release.html
          app/build/reports/lint-results-release.xml
        if-no-files-found: warn

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/keystore.jks \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk \
           app/build/outputs/apk/release/CloudFlareAssistant-${{ inputs.version_tag }}.apk

    - name: Get version info
      id: version
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
        VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | awk -F'=' '{print $2}' | tr -d ' ')
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "tag_name=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT

    - name: Create and push Git tag
      run: |
        TAG_NAME="${{ inputs.version_tag }}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
        git push origin "$TAG_NAME"
        echo "✅ Tag $TAG_NAME 创建并推送成功"

    - name: Prepare Release Notes
      id: release_notes
      run: |
        TAG_NAME="${{ steps.version.outputs.tag_name }}"
        RELEASE_NOTES_FILE="RELEASE_NOTES_${TAG_NAME}.md"

        if [ -f "$RELEASE_NOTES_FILE" ]; then
          echo "使用 $RELEASE_NOTES_FILE 作为发布说明"
          {
            echo "## 🎉 CloudFlare Assistant ${TAG_NAME} 发布"
            echo ""
            echo "**版本号**: ${{ steps.version.outputs.version_name }}"
            echo "**Build**: ${{ steps.version.outputs.version_code }}"
            echo ""
            cat "$RELEASE_NOTES_FILE"
            echo ""
          } > release_notes.md
        else
          echo "未找到 $RELEASE_NOTES_FILE，使用默认模板"
          {
            echo "## 🎉 新版本发布"
            echo ""
            echo "**版本号**: ${{ steps.version.outputs.version_name }}"
            echo "**Build**: ${{ steps.version.outputs.version_code }}"
            echo ""
            echo "### 📥 下载"
            echo "点击下方的 APK 文件即可下载安装（已签名）"
            echo ""
            echo "### 📦 安装要求"
            echo "- 最低 Android 版本: 8.0 (API 26)"
            echo "- 目标 Android 版本: 16 (API 36)"
            echo ""
            echo "### 🔐 签名信息"
            echo "此版本已使用开发者证书签名，可以直接安装使用。"
          } > release_notes.md
        fi

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag_name }}
        files: app/build/outputs/apk/release/CloudFlareAssistant-${{ steps.version.outputs.tag_name }}.apk
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ==================== 修复后的 Telegram 推送步骤 ====================
    - name: Send APK to Telegram
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
      run: |
        TAG_NAME="${{ steps.version.outputs.tag_name }}"
        VERSION_NAME="${{ steps.version.outputs.version_name }}"
        VERSION_CODE="${{ steps.version.outputs.version_code }}"
        APK_FILE="app/build/outputs/apk/release/CloudFlareAssistant-${TAG_NAME}.apk"

        # 详细更新说明链接（直接指向 GitHub 仓库中的 RELEASE_NOTES 文件）
        RELEASE_NOTES_URL="https://github.com/a422015028/CloudFlareAssistant/blob/main/RELEASE_NOTES_${TAG_NAME}.md"

        # 构建简短 caption（不含长篇文本，只有链接）
        CAPTION="🎉 <b>CloudFlare Assistant ${TAG_NAME} 发布</b>

        📱 <b>版本信息</b>
        • 版本号: ${VERSION_NAME}
        • Build: ${VERSION_CODE}
        • 发布日期: $(date +'%Y年%m月%d日')

        📄 <b>详细更新说明</b>
        <a href=\"${RELEASE_NOTES_URL}\">点击查看完整更新日志</a>

        📦 <b>安装要求</b>
        • 最低版本: Android 8.0 (API 26)
        • 目标版本: Android 16 (API 36)"

        # 发送 APK 文件到 Telegram（支持话题）
        echo "📤 正在发送 APK 文件到 Telegram..."
        if [ -n "$TELEGRAM_TOPIC_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "message_thread_id=${TELEGRAM_TOPIC_ID}" \
            -F "document=@${APK_FILE}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=HTML"
        else
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_FILE}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=HTML"
        fi
        echo "✅ APK 文件和发布说明已发送到 Telegram"
