name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: '版本标签 (例如: v7.8.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo $KEYSTORE_BASE64 | base64 -d > $GITHUB_WORKSPACE/app/keystore.jks

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/keystore.jks \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk \
           app/build/outputs/apk/release/CloudFlareAssistant-${{ inputs.version_tag }}.apk

    - name: Get version info
      id: version
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
        VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | awk -F'=' '{print $2}' | tr -d ' ')
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "tag_name=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT

    - name: Prepare Release Notes
      id: release_notes
      run: |
        TAG_NAME="${{ steps.version.outputs.tag_name }}"
        RELEASE_NOTES_FILE="RELEASE_NOTES_${TAG_NAME}.md"

        if [ -f "$RELEASE_NOTES_FILE" ]; then
          echo "使用 $RELEASE_NOTES_FILE 作为发布说明"
          # 直接使用 RELEASE_NOTES 文件内容，不再添加额外标题/版本信息
          cp "$RELEASE_NOTES_FILE" release_notes.md
        else
          echo "未找到 $RELEASE_NOTES_FILE，使用默认模板"
          {
            echo "## 🎉 新版本发布"
            echo ""
            echo "### 📥 下载"
            echo "点击下方的 APK 文件即可下载安装（已签名）"
            echo ""
            echo "### 📦 安装要求"
            echo "- 最低 Android 版本: 8.0 (API 26)"
            echo "- 目标 Android 版本: 17 (API 37)"
            echo ""
            echo "### 🔐 签名信息"
            echo "此版本已使用开发者证书签名，可以直接安装使用。"
          } > release_notes.md
        fi

    - name: Create Release and Upload APK
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="${{ steps.version.outputs.tag_name }}"
        APK_FILE="app/build/outputs/apk/release/CloudFlareAssistant-${TAG_NAME}.apk"

        # 如果 release 已存在（例如上一次上传失败留下的空 release），先删除
        if gh release view "$TAG_NAME" > /dev/null 2>&1; then
          echo "⚠️  Release $TAG_NAME 已存在，先删除旧 release"
          gh release delete "$TAG_NAME" --yes
        fi

        # 使用 GitHub 官方 CLI 原子化创建 tag + release + 上传 asset，
        # 避免第三方 action 的 tag 推送与 release 创建竞态导致 500
        gh release create "$TAG_NAME" \
          "$APK_FILE" \
          --title "$TAG_NAME" \
          --notes-file release_notes.md \
          --target "$GITHUB_SHA"
        echo "✅ Release $TAG_NAME 创建并上传 APK 成功"

    # ==================== Telegram 推送步骤 ====================
    - name: Send APK to Telegram
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
      run: |
        TAG_NAME="${{ steps.version.outputs.tag_name }}"
        APK_FILE="app/build/outputs/apk/release/CloudFlareAssistant-${TAG_NAME}.apk"
        RELEASE_NOTES_FILE="RELEASE_NOTES_${TAG_NAME}.md"
        RELEASE_NOTES_URL="https://github.com/a422015028/CloudFlareAssistant/blob/main/RELEASE_NOTES_${TAG_NAME}.md"

        # 优先使用 RELEASE_NOTES 文件内容作为 caption（Markdown 转 HTML）
        if [ -f "$RELEASE_NOTES_FILE" ] && [ -s "$RELEASE_NOTES_FILE" ]; then
          CAPTION=$(sed -E \
            -e 's/^## \*\*(.+)\*\*$/<b>\1<\/b>/' \
            -e 's/^#### (.+)$/<b>\1<\/b>/' \
            -e 's/^> \*\*(.+)\*\*(.*)$/<b>\1<\/b>\2/' \
            -e 's/^- (.+)$/• \1/' \
            -e 's/\*\*(.+?)\*\*/<b>\1<\/b>/g' \
            "$RELEASE_NOTES_FILE")

          # Telegram caption 上限 1024 字符，超长则截断并附链接
          if [ ${#CAPTION} -gt 900 ]; then
            CAPTION=$(printf '%s\n\n%s' "${CAPTION:0:900}..." "<a href=\"${RELEASE_NOTES_URL}\">查看完整更新说明</a>")
          fi
          echo "使用 $RELEASE_NOTES_FILE 内容作为 Telegram caption"
        else
          # 解析失败时回退到链接
          CAPTION=$(printf '%s\n\n%s\n%s' \
            "🎉 <b>CloudFlare Assistant ${TAG_NAME} 发布</b>" \
            "📄 <b>更新说明</b>" \
            "<a href=\"${RELEASE_NOTES_URL}\">点击查看完整更新日志</a>")
          echo "未找到 $RELEASE_NOTES_FILE，使用链接回退"
        fi

        # 发送 APK 文件到 Telegram（支持话题）
        echo "📤 正在发送 APK 文件到 Telegram..."
        if [ -n "$TELEGRAM_TOPIC_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "message_thread_id=${TELEGRAM_TOPIC_ID}" \
            -F "document=@${APK_FILE}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=HTML"
        else
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_FILE}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=HTML"
        fi
        echo "✅ APK 文件和发布说明已发送到 Telegram"
